<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイタイムカード</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; color: #1f2937; padding: 16px; max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 16px; color: #1d4ed8; }
    
    .nav { display: flex; gap: 8px; margin-bottom: 16px; }
    .nav button { flex: 1; padding: 10px; border: none; background: #e5e7eb; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
    .nav button.active { background: #2563eb; color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: #374151; }

    .clock { font-size: 2rem; font-weight: bold; text-align: center; margin: 12px 0; color: #111827; }
    
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; color: white; cursor: pointer; margin-bottom: 8px; }
    .btn-primary { background: #2563eb; }
    .btn-secondary { background: #10b981; }
    .btn-outline { background: transparent; color: #4b5563; border: 1px solid #d1d5db; }

    .info-box { background: #eff6ff; border-left: 4px solid #2563eb; padding: 12px; border-radius: 4px; margin-top: 12px; }
    .info-box p { font-size: 0.95rem; margin-bottom: 4px; }

    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.85rem; color: #4b5563; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: left; }
    th { background: #f9fafb; font-weight: 600; color: #4b5563; }
  </style>
</head>
<body>

  <h1>⏱️ マイタイムカード</h1>

  <div class="nav">
    <button id="tab-btn-main" class="active" onclick="switchTab('main')">打刻</button>
    <button id="tab-btn-history" onclick="switchTab('history')">履歴・CSV</button>
    <button id="tab-btn-settings" onclick="switchTab('settings')">設定</button>
  </div>

  <!-- メイン画面 -->
  <div id="tab-main" class="tab-content active">
    <div class="card">
      <div id="current-time" class="clock">00:00:00</div>
      <button class="btn btn-primary" onclick="clockIn()">出勤（タイムカード打刻）</button>
      <button class="btn btn-secondary" onclick="clockOut()">退勤（任意）</button>
    </div>

    <div class="card">
      <h2>本日のステータス</h2>
      <div id="today-status" class="info-box">
        <p>本日の打刻データはありません。</p>
      </div>
    </div>
  </div>

  <!-- 履歴画面 -->
  <div id="tab-history" class="tab-content">
    <div class="card">
      <h2>打刻履歴（LocalStorage保存）</h2>
      <button class="btn btn-outline" style="margin-bottom: 12px;" onclick="downloadCSV()">CSVダウンロード</button>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>出勤</th>
              <th>休憩終了予定</th>
              <th>退勤</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <!-- JSで動的生成 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 設定画面 -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <h2>設定</h2>
      <div class="input-group">
        <label for="break-minutes">標準休憩時間 (分)</label>
        <input type="number" id="break-minutes" value="60" onchange="saveSettings()">
      </div>
      <button class="btn btn-outline" onclick="requestNotificationPermission()">通知許可を有効化</button>
    </div>
  </div>

  <script>
    // --- 時計機能 ---
    function updateClock() {
      const now = new Date();
      document.getElementById('current-time').innerText = now.toLocaleTimeString('ja-JP');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- タブ切替 ---
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.getElementById(`tab-btn-${tabName}`).classList.add('active');
      if (tabName === 'history') renderHistory();
    }

    // --- データ読み書き ---
    function getRecords() {
      return JSON.parse(localStorage.getItem('timecard_records') || '[]');
    }

    function saveRecords(records) {
      localStorage.setItem('timecard_records', JSON.stringify(records));
    }

    function getBreakMinutes() {
      return parseInt(localStorage.getItem('timecard_break_min') || '60', 10);
    }

    function saveSettings() {
      const min = document.getElementById('break-minutes').value;
      localStorage.setItem('timecard_break_min', min);
    }

    // Init 設定値
    document.getElementById('break-minutes').value = getBreakMinutes();

    // --- 打刻機能 ---
    function clockIn() {
      const now = new Date();
      const todayStr = now.toLocaleDateString('ja-JP');
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      // 休憩終了時間の計算
      const breakMin = getBreakMinutes();
      const breakEnd = new Date(now.getTime() + breakMin * 60000);
      const breakEndStr = breakEnd.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      let records = getRecords();
      let todayRecord = records.find(r => r.date === todayStr);

      if (!todayRecord) {
        todayRecord = { date: todayStr, clockIn: timeStr, breakEnd: breakEndStr, clockOut: '-' };
        records.unshift(todayRecord);
      } else {
        todayRecord.clockIn = timeStr;
        todayRecord.breakEnd = breakEndStr;
      }

      saveRecords(records);
      renderTodayStatus();
      scheduleNotification(breakEnd);
    }

    function clockOut() {
      const now = new Date();
      const todayStr = now.toLocaleDateString('ja-JP');
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      let records = getRecords();
      let todayRecord = records.find(r => r.date === todayStr);

      if (todayRecord) {
        todayRecord.clockOut = timeStr;
      } else {
        todayRecord = { date: todayStr, clockIn: '-', breakEnd: '-', clockOut: timeStr };
        records.unshift(todayRecord);
      }

      saveRecords(records);
      renderTodayStatus();
    }

    function renderTodayStatus() {
      const todayStr = new Date().toLocaleDateString('ja-JP');
      const records = getRecords();
      const todayRecord = records.find(r => r.date === todayStr);
      const container = document.getElementById('today-status');

      if (todayRecord) {
        container.innerHTML = `
          <p><strong>出勤時刻:</strong> ${todayRecord.clockIn}</p>
          <p><strong>休憩終了予定:</strong> ${todayRecord.breakEnd}</p>
          <p><strong>退勤時刻:</strong> ${todayRecord.clockOut}</p>
        `;
      } else {
        container.innerHTML = `<p>本日の打刻データはありません。</p>`;
      }
    }
    renderTodayStatus();

    // --- 履歴描画 ---
    function renderHistory() {
      const records = getRecords();
      const tbody = document.getElementById('history-table-body');
      tbody.innerHTML = records.map(r => `
        <tr>
          <td>${r.date}</td>
          <td>${r.clockIn}</td>
          <td>${r.breakEnd}</td>
          <td>${r.clockOut}</td>
        </tr>
      `).join('');
    }

    // --- CSVダウンロード ---
    function downloadCSV() {
      const records = getRecords();
      let csvContent = "\uFEFF日付,出勤,休憩終了予定,退勤\n";
      records.forEach(r => {
        csvContent += `"${r.date}","${r.clockIn}","${r.breakEnd}","${r.clockOut}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `timecard_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // --- 通知機能 ---
    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') alert('通知が許可されました');
        });
      }
    }

    function scheduleNotification(breakEndTime) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;

      const now = new Date().getTime();
      const endTime = breakEndTime.getTime();
      const fiveMinBefore = endTime - (5 * 60 * 1000);

      // 5分前通知
      if (fiveMinBefore > now) {
        setTimeout(() => {
          new Notification('⏱️ 休憩終了5分前です', { body: '準備を開始してください。' });
        }, fiveMinBefore - now);
      }

      // 終了通知
      if (endTime > now) {
        setTimeout(() => {
          new Notification('⏱️ 休憩終了時間です', { body: 'お仕事に戻る時間です！' });
        }, endTime - now);
      }
    }
  </script>
</body>
</html>
