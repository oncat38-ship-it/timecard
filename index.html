<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ 休憩タイムカード</title>
  
  <!-- スマホのホーム画面に追加したときのアイコン設定（コード埋め込みSVG） -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2255%22 font-size=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>⏱️</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2255%22 font-size=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>⏱️</text></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; color: #1f2937; padding: 16px; max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 16px; color: #1d4ed8; }
    
    .nav { display: flex; gap: 8px; margin-bottom: 16px; }
    .nav button { flex: 1; padding: 10px; border: none; background: #e5e7eb; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
    .nav button.active { background: #2563eb; color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; text-align: center; }
    .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: #374151; text-align: left; }

    .clock { font-size: 1.5rem; font-weight: bold; color: #4b5563; margin-bottom: 8px; }
    
    .target-time-box { background: #eff6ff; border: 2px solid #2563eb; border-radius: 10px; padding: 16px; margin: 12px 0; }
    .target-time-label { font-size: 0.85rem; color: #1e40af; font-weight: bold; margin-bottom: 4px; }
    .target-time-value { font-size: 2.8rem; font-weight: 900; color: #1d4ed8; line-height: 1; margin-bottom: 8px; }
    .countdown-text { font-size: 1rem; font-weight: bold; color: #047857; }

    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; color: white; cursor: pointer; margin-bottom: 8px; }
    .btn-primary { background: #2563eb; }
    .btn-secondary { background: #10b981; }
    .btn-danger { background: #ef4444; }
    .btn-outline { background: transparent; color: #4b5563; border: 1px solid #d1d5db; }

    .info-box { background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; border-radius: 8px; margin-top: 12px; text-align: left; }
    .info-box p { font-size: 0.9rem; margin-bottom: 4px; }

    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; color: #4b5563; margin-bottom: 4px; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; background: white; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: left; }
    th { background: #f9fafb; font-weight: 600; color: #4b5563; }
  </style>
</head>
<body>

  <h1>☕ 休憩タイムカード</h1>

  <div class="nav">
    <button id="tab-btn-main" class="active" onclick="switchTab('main')">打刻</button>
    <button id="tab-btn-history" onclick="switchTab('history')">履歴・CSV</button>
    <button id="tab-btn-settings" onclick="switchTab('settings')">設定</button>
  </div>

  <!-- メイン画面 -->
  <div id="tab-main" class="tab-content active">
    <div class="card">
      <div id="current-time" class="clock">現在時刻: 00:00:00</div>
      
      <div class="target-time-box">
        <div class="target-time-label">🚨 休憩戻り予定時刻 🚨</div>
        <div id="display-target-time" class="target-time-value">--:--</div>
        <div id="display-countdown" class="countdown-text">打刻していません</div>
      </div>

      <button class="btn btn-primary" onclick="breakIn()">☕ 休憩入り（打刻）</button>
      <button class="btn btn-secondary" onclick="breakOut()">🏢 休憩戻り（任意）</button>
      <button class="btn btn-danger" onclick="cancelTodayRecord()" style="margin-top: 12px; font-size: 0.85rem; padding: 10px;">⚠️ 本日の打刻を取り消す</button>
    </div>

    <div class="card" style="text-align: left;">
      <h2>本日の詳細ステータス</h2>
      <div id="today-status" class="info-box">
        <p>本日の打刻データはありません。</p>
      </div>
    </div>
  </div>

  <!-- 履歴画面 -->
  <div id="tab-history" class="tab-content">
    <div class="card" style="text-align: left;">
      <h2>休憩履歴・CSV</h2>
      <button class="btn btn-outline" style="margin-bottom: 12px;" onclick="downloadCSV()">CSVダウンロード</button>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>休憩入り</th>
              <th>戻り予定</th>
              <th>戻り(実)</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <!-- JSで動的生成 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 設定画面 -->
  <div id="tab-settings" class="tab-content">
    <div class="card" style="text-align: left;">
      <h2>通知・休憩時間の設定</h2>
      
      <div class="input-group">
        <label for="break-minutes">標準休憩時間 (分)</label>
        <input type="number" id="break-minutes" value="60" onchange="saveSettings()">
      </div>

      <div class="input-group">
        <label for="notify-before">何分前に最初の通知をするか</label>
        <select id="notify-before" onchange="saveSettings()">
          <option value="1">1分前</option>
          <option value="3">3分前</option>
          <option value="5" selected>5分前</option>
          <option value="10">10分前</option>
        </select>
      </div>

      <div class="input-group">
        <label for="notify-count">通知回数（直前から終了まで）</label>
        <select id="notify-count" onchange="saveSettings()">
          <option value="1">1回（設定時間前のみ）</option>
          <option value="2" selected>2回（設定時間前 ＆ 終了時）</option>
          <option value="3">3回（細かいリマインド）</option>
        </select>
      </div>

      <button class="btn btn-outline" style="margin-top: 12px;" onclick="requestNotificationPermission()">🔔 ブラウザ通知を有効化する</button>
    </div>
  </div>

  <script>
    let activeTimerId = null;
    let targetEndTimeObj = null;

    function updateClock() {
      const now = new Date();
      document.getElementById('current-time').innerText = `現在時刻: ${now.toLocaleTimeString('ja-JP')}`;

      if (targetEndTimeObj) {
        const diffMs = targetEndTimeObj.getTime() - now.getTime();
        const targetStr = targetEndTimeObj.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('display-target-time').innerText = targetStr;

        if (diffMs > 0) {
          const diffMin = Math.floor(diffMs / 60000);
          const diffSec = Math.floor((diffMs % 60000) / 1000);
          document.getElementById('display-countdown').innerText = `あと ${diffMin}分 ${diffSec}秒`;
          document.getElementById('display-countdown').style.color = '#047857';
          document.title = `(${diffMin}分前) ☕ 休憩タイムカード`;
        } else {
          document.getElementById('display-countdown').innerText = '⏰ 戻り時間を過ぎています！';
          document.getElementById('display-countdown').style.color = '#ef4444';
          document.title = `⚠️【時間超過】休憩タイムカード`;
        }
      } else {
        document.getElementById('display-target-time').innerText = '--:--';
        document.getElementById('display-countdown').innerText = '打刻していません';
        document.getElementById('display-countdown').style.color = '#4b5563';
        document.title = '☕ 休憩タイムカード';
      }
    }
    setInterval(updateClock, 1000);

    function initTargetTime() {
      const todayStr = new Date().toLocaleDateString('ja-JP');
      const records = getRecords();
      const todayRecord = records.find(r => r.date === todayStr);
      if (todayRecord && todayRecord.breakExpected && todayRecord.breakExpected !== '-') {
        const [h, m] = todayRecord.breakExpected.split(':');
        const d = new Date();
        d.setHours(parseInt(h, 10), parseInt(m, 10), 0, 0);
        targetEndTimeObj = d;
      } else {
        targetEndTimeObj = null;
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.getElementById(`tab-btn-${tabName}`).classList.add('active');
      if (tabName === 'history') renderHistory();
    }

    function getRecords() {
      return JSON.parse(localStorage.getItem('break_records') || '[]');
    }

    function saveRecords(records) {
      localStorage.setItem('break_records', JSON.stringify(records));
    }

    function getSettings() {
      return {
        breakMin: parseInt(localStorage.getItem('break_min') || '60', 10),
        notifyBefore: parseInt(localStorage.getItem('notify_before') || '5', 10),
        notifyCount: parseInt(localStorage.getItem('notify_count') || '2', 10)
      };
    }

    function saveSettings() {
      localStorage.setItem('break_min', document.getElementById('break-minutes').value);
      localStorage.setItem('notify_before', document.getElementById('notify-before').value);
      localStorage.setItem('notify_count', document.getElementById('notify-count').value);
    }

    const settings = getSettings();
    document.getElementById('break-minutes').value = settings.breakMin;
    document.getElementById('notify-before').value = settings.notifyBefore;
    document.getElementById('notify-count').value = settings.notifyCount;

    function breakIn() {
      const now = new Date();
      const todayStr = now.toLocaleDateString('ja-JP');
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      const breakEnd = new Date(now.getTime() + settings.breakMin * 60000);
      const breakEndStr = breakEnd.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      targetEndTimeObj = breakEnd;

      let records = getRecords();
      let todayRecord = records.find(r => r.date === todayStr);

      if (!todayRecord) {
        todayRecord = { date: todayStr, breakIn: timeStr, breakExpected: breakEndStr, breakOut: '-' };
        records.unshift(todayRecord);
      } else {
        todayRecord.breakIn = timeStr;
        todayRecord.breakExpected = breakEndStr;
      }

      saveRecords(records);
      renderTodayStatus();
      scheduleNotifications(breakEnd);
      alert(`休憩入りを記録しました！\n戻り予定: ${breakEndStr}`);
    }

    function breakOut() {
      const now = new Date();
      const todayStr = now.toLocaleDateString('ja-JP');
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      let records = getRecords();
      let todayRecord = records.find(r => r.date === todayStr);

      if (todayRecord) {
        todayRecord.breakOut = timeStr;
      } else {
        todayRecord = { date: todayStr, breakIn: '-', breakExpected: '-', breakOut: timeStr };
        records.unshift(todayRecord);
      }

      saveRecords(records);
      renderTodayStatus();
      targetEndTimeObj = null;
      if (activeTimerId) clearTimeout(activeTimerId);
      document.title = '☕ 休憩タイムカード';
      alert('休憩戻りを記録しました。お疲れ様です！');
    }

    function cancelTodayRecord() {
      if (!confirm('本日の打刻データをリセット（取り消し）しますか？')) return;
      const todayStr = new Date().toLocaleDateString('ja-JP');
      let records = getRecords();
      records = records.filter(r => r.date !== todayStr);
      saveRecords(records);
      renderTodayStatus();
      targetEndTimeObj = null;
      if (activeTimerId) clearTimeout(activeTimerId);
      document.title = '☕ 休憩タイムカード';
      alert('本日の打刻を削除しました。');
    }

    function renderTodayStatus() {
      const todayStr = new Date().toLocaleDateString('ja-JP');
      const records = getRecords();
      const todayRecord = records.find(r => r.date === todayStr);
      const container = document.getElementById('today-status');

      if (todayRecord) {
        container.innerHTML = `
          <p><strong>日付:</strong> ${todayRecord.date}</p>
          <p><strong>休憩入り:</strong> ${todayRecord.breakIn}</p>
          <p><strong>休憩戻り予定:</strong> ${todayRecord.breakExpected}</p>
          <p><strong>休憩戻り(実):</strong> ${todayRecord.breakOut}</p>
        `;
      } else {
        container.innerHTML = `<p>本日の打刻データはありません。</p>`;
      }
    }

    initTargetTime();
    renderTodayStatus();

    function renderHistory() {
      const records = getRecords();
      const tbody = document.getElementById('history-table-body');
      tbody.innerHTML = records.map(r => `
        <tr>
          <td>${r.date}</td>
          <td>${r.breakIn}</td>
          <td>${r.breakExpected}</td>
          <td>${r.breakOut}</td>
        </tr>
      `).join('');
    }

    function downloadCSV() {
      const records = getRecords();
      let csvContent = "\uFEFF日付,休憩入り,休憩戻り予定,休憩戻り(実)\n";
      records.forEach(r => {
        csvContent += `"${r.date}","${r.breakIn}","${r.breakExpected}","${r.breakOut}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `break_record_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            alert('通知が許可されました！');
          } else {
            alert('通知が拒否されています。ブラウザの設定をご確認ください。');
          }
        });
      } else {
        alert('このブラウザは通知機能に対応していません。');
      }
    }

    function scheduleNotifications(breakEndTime) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      if (activeTimerId) clearTimeout(activeTimerId);

      const now = new Date().getTime();
      const endTime = breakEndTime.getData ? breakEndTime.getData() : breakEndTime.getTime();
      const currentSettings = getSettings();
      
      const beforeMs = currentSettings.notifyBefore * 60 * 1000;
      const firstNotifyTime = endTime - beforeMs;

      if (firstNotifyTime > now) {
        const delay1 = firstNotifyTime - now;
        activeTimerId = setTimeout(() => {
          new Notification(`☕ 休憩終了 ${currentSettings.notifyBefore}分前です`, { body: 'そろそろ戻る準備を始めましょう。' });
          
          if (currentSettings.notifyCount >= 2) {
            setTimeout(() => {
              new Notification('⏰ まもなく休憩終了です', { body: 'あとわずかで休憩時間が終わります。' });
            }, beforeMs / 2);
          }

          if (currentSettings.notifyCount >= 3) {
            setTimeout(() => {
              new Notification('🚨 休憩終了時間です！', { body: 'お仕事の時間です。お戻りください！' });
            }, beforeMs);
          }

        }, delay1);
      }
    }
  </script>
</body>
</html>
